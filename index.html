<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ponto</title>

    <!-- Ícones e modo tela cheia -->
    <link rel="apple-touch-icon" href="icone-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ponto">
    <link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#090d16">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #090d16;
            display: flex;
            flex-direction: column;
            padding: 16px 16px 20px 16px;
            gap: 14px;
        }

        /* Barra de status superior */
        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 600;
        }

        .wifi-status {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.06);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .dot-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #f59e0b; /* Amarelo/Laranja padrão */
        }

        .dot-status.conectado {
            background-color: #10b981; /* Verde */
            box-shadow: 0 0 8px #10b981;
        }

        /* Cartões dos botões verticais */
        .card-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 28px;
            border: none;
            cursor: pointer;
            color: #ffffff;
            position: relative;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
            transition: transform 0.12s ease, filter 0.12s ease;
        }

        .card-btn:active {
            transform: scale(0.97);
            filter: brightness(0.92);
        }

        /* Cartão Entrada (Verde Esmeralda) */
        #btn-entrada {
            background: linear-gradient(145deg, #10b981 0%, #047857 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Cartão Saída (Vermelho Rubi) */
        #btn-saida {
            background: linear-gradient(145deg, #f43f5e 0%, #be123c 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .circulo-icone {
            width: 104px;
            height: 104px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 54px;
            margin-bottom: 12px;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.3), 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .texto-principal {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .texto-secundario {
            font-size: 15px;
            font-weight: 500;
            opacity: 0.9;
            margin-top: 4px;
        }

        /* Notificação flutuante */
        .toast-notificacao {
            position: fixed;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.96);
            color: #f8fafc;
            padding: 14px 26px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            display: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            white-space: nowrap;
            z-index: 100;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <span>CONTROLE DE PONTO</span>
        <div class="wifi-status">
            <div id="indicador-wifi" class="dot-status"></div>
            <span id="texto-wifi">Verificando Wi-Fi...</span>
        </div>
    </div>

    <!-- Botão de Entrada -->
    <button id="btn-entrada" class="card-btn" onclick="registrarPonto('ENTRADA')">
        <div class="circulo-icone">☀️</div>
        <span class="texto-principal">Entrada</span>
        <span class="texto-secundario">Chegada ao trabalho</span>
    </button>

    <!-- Botão de Saída -->
    <button id="btn-saida" class="card-btn" onclick="registrarPonto('SAÍDA')">
        <div class="circulo-icone">🌙</div>
        <span class="texto-principal">Saída</span>
        <span class="texto-secundario">Fim do expediente</span>
    </button>

    <div id="toast" class="toast-notificacao">Processando...</div>

    <script>
        // ================= CONFIGURAÇÃO =================
        // Cole aqui a URL de implantação da sua planilha (terminada em /exec)
        const URL_WEB_APP = https://script.google.com/macros/s/AKfycbzx1kOOKCWoaworM4n7BS7DQwUs-z9zr1ETJuHhdkjP9cVIJlmvAj6rkO2dVWpSX5Wp8w/exec;

        // ================================================

        let bloqueado = false;

        // Motor de fala imediato
        function falar(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(texto);
                utterance.lang = 'pt-BR';
                utterance.rate = 0.92;
                window.speechSynthesis.speak(utterance);
            }
        }

        function exibirToast(msg, tempo = 3500) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.style.display = "block";
            if (tempo > 0) {
                setTimeout(() => {
                    toast.style.display = "none";
                    bloqueado = false;
                }, tempo);
            }
        }

        // Verifica o tipo de conexão no Android Chrome
        function verificarConexao() {
            const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            const dot = document.getElementById("indicador-wifi");
            const label = document.getElementById("texto-wifi");

            if (!conn) {
                label.innerText = "Rede Online";
                return { estaNoWifi: true, tipo: 'desconhecido' };
            }

            // No Android (Chrome e Samsung Browser), conn.type retorna 'wifi' ou 'cellular'
            const tipo = conn.type || '';
            const eWifi = (tipo === 'wifi');

            if (eWifi) {
                dot.classList.add("conectado");
                label.innerText = "Wi-Fi Conectado";
            } else {
                dot.classList.remove("conectado");
                label.innerText = tipo === 'cellular' ? "4G/5G Móvel" : "Sem Wi-Fi";
            }

            return { estaNoWifi: eWifi, tipo: tipo };
        }

        // Monitora em tempo real se ela ligou ou desligou o Wi-Fi
        const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (conn) {
            conn.addEventListener('change', verificarConexao);
        }
        verificarConexao();

        function registrarPonto(acao) {
            if (bloqueado) return;
            bloqueado = true;

            const conexao = verificarConexao();

            // REGRA: Se NÃO estiver no Wi-Fi
            if (!conexao.estaNoWifi) {
                // Fala obrigatória
                falar("Conecte-se à rede Wi-Fi do apartamento.");
                exibirToast("Conecte-se à rede Wi-Fi do apartamento", 4000);
                return;
            }

            // Se ESTIVER no Wi-Fi: processa imediatamente
            const agora = new Date();
            const h = agora.getHours();
            const m = ("0" + agora.getMinutes()).slice(-2);

            // Fala de confirmação de entrada ou saída
            falar(`${acao === 'ENTRADA' ? 'Entrada' : 'Saída'} confirmada às ${h} horas e ${m} minutos.`);
            exibirToast(`Gravado: ${acao} às ${h}:${m}`, 3500);

            // Dispara para o Google Sheets em segundo plano
            const urlFinal = `${URL_WEB_APP}?acao=${encodeURIComponent(acao)}&t=${Date.now()}`;
            fetch(urlFinal, { method: 'GET', mode: 'no-cors' }).catch(() => {
                const beacon = new Image();
                beacon.src = urlFinal;
            });
        }
    </script>
</body>
</html>
