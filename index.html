<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ponto</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #111827;
            display: flex;
            flex-direction: row; /* Em tablets, botões lado a lado aproveitam melhor a tela */
        }
        .btn-ponto {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            color: #ffffff;
        }
        .btn-ponto:active {
            opacity: 0.8;
            transform: scale(0.98);
        }
        #btn-entrada {
            background-color: #16a34a; /* Verde */
            border-right: 4px solid #111827;
        }
        #btn-saida {
            background-color: #dc2626; /* Vermelho */
            border-left: 4px solid #111827;
        }
        .icone {
            font-size: 80px;
            margin-bottom: 20px;
        }
        .rotulo {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .status-msg {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            color: #f9fafb;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <button id="btn-entrada" class="btn-ponto" onclick="baterPonto('ENTRADA')">
        <span class="icone">☀️</span>
        <span class="rotulo">Entrada</span>
    </button>

    <button id="btn-saida" class="btn-ponto" onclick="baterPonto('SAÍDA')">
        <span class="icone">🌙</span>
        <span class="rotulo">Saída</span>
    </button>

    <div id="aviso" class="status-msg">Registrando...</div>


    <script>
        const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbzx1kOOKCWoaworM4n7BS7DQwUs-z9zr1ETJuHhdkjP9cVIJlmvAj6rkO2dVWpSX5Wp8w/exec";
    
        // 1. COLOQUE AS COORDENADAS EXATAS DA SUA CASA AQUI
        const LATITUDE_CASA = -8.05389;   // Substitua pela latitude da sua residência
        const LONGITUDE_CASA = -34.88111; // Substitua pela longitude da sua residência
        const RAIO_MAXIMO_METROS = 100;   // Margem de tolerância (recomendado: 100m para GPS indoor)
    
        let bloqueado = false;
    
        function falar(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(texto);
                utterance.lang = 'pt-BR';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }
    
        // Fórmula para calcular distância entre dois pontos geográficos em metros
        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Raio da Terra em metros
            const phi1 = lat1 * Math.PI / 180;
            const phi2 = lat2 * Math.PI / 180;
            const deltaPhi = (lat2 - lat1) * Math.PI / 180;
            const deltaLambda = (lon2 - lon1) * Math.PI / 180;
    
            const a = Math.sin(deltaPhi / 2) * Math.sin(deltaPhi / 2) +
                      Math.cos(phi1) * Math.cos(phi2) *
                      Math.sin(deltaLambda / 2) * Math.sin(deltaLambda / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    
            return R * c;
        }
    
        function baterPonto(tipo) {
            if (bloqueado) return;
            bloqueado = true;
    
            const aviso = document.getElementById("aviso");
            aviso.innerText = "Verificando local...";
            aviso.style.display = "block";
    
            if (!navigator.geolocation) {
                falar("Seu aparelho não possui GPS.");
                aviso.style.display = "none";
                bloqueado = false;
                return;
            }
    
            navigator.geolocation.getCurrentPosition(
                (posicao) => {
                    const latAtual = posicao.coords.latitude;
                    const lonAtual = posicao.coords.longitude;
                    const distancia = calcularDistancia(latAtual, lonAtual, LATITUDE_CASA, LONGITUDE_CASA);
    
                    // Se estiver dentro do raio da residência
                    if (distancia <= RAIO_MAXIMO_METROS) {
                        const agora = new Date();
                        const h = agora.getHours();
                        const m = ("0" + agora.getMinutes()).slice(-2);
    
                        falar(`${tipo === 'ENTRADA' ? 'Entrada' : 'Saída'} confirmada às ${h} horas e ${m} minutos.`);
                        aviso.innerText = `Gravado: ${tipo} às ${h}:${m}`;
    
                        const urlFinal = `${URL_WEB_APP}?acao=${encodeURIComponent(tipo)}&t=${agora.getTime()}`;
                        fetch(urlFinal, { method: 'GET', mode: 'no-cors' })
                            .catch(() => {
                                const ping = new Image();
                                ping.src = urlFinal;
                            });
    
                        setTimeout(() => {
                            bloqueado = false;
                            aviso.style.display = "none";
                        }, 4000);
    
                    } else {
                        falar("Atenção. Você precisa estar na residência para bater o ponto.");
                        aviso.innerText = "Fora da residência!";
                        setTimeout(() => {
                            bloqueado = false;
                            aviso.style.display = "none";
                        }, 4000);
                    }
                },
                (erro) => {
                    falar("Não foi possível obter a sua localização. Ative o GPS.");
                    aviso.innerText = "Erro no GPS";
                    setTimeout(() => {
                        bloqueado = false;
                        aviso.style.display = "none";
                    }, 4000);
                },
                { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
            );
        }
    </script>


    
    </body>
</html>
