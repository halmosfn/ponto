<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ponto</title>

    <!-- Metas para funcionamento como Aplicativo de Tela Cheia -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ponto">
    <meta name="theme-color" content="#090d16">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #090d16;
            display: flex;
            flex-direction: column;
            padding: 16px 16px 20px 16px;
            gap: 14px;
        }

        /* Barra de status superior */
        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 600;
        }

        .wifi-status {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.06);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .dot-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #f59e0b; /* Amarelo: checando */
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        .dot-status.conectado {
            background-color: #10b981; /* Verde: validado */
            box-shadow: 0 0 10px #10b981;
        }

        .dot-status.bloqueado {
            background-color: #ef4444; /* Vermelho: fora da rede */
            box-shadow: 0 0 8px #ef4444;
        }

        /* Cartões dos botões gigantes */
        .card-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 28px;
            border: none;
            cursor: pointer;
            color: #ffffff;
            position: relative;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
            transition: transform 0.12s ease, filter 0.12s ease;
        }

        .card-btn:active {
            transform: scale(0.97);
            filter: brightness(0.92);
        }

        #btn-entrada {
            background: linear-gradient(145deg, #10b981 0%, #047857 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #btn-saida {
            background: linear-gradient(145deg, #f43f5e 0%, #be123c 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .circulo-icone {
            width: 104px;
            height: 104px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 54px;
            margin-bottom: 12px;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.3), 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .texto-principal {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .texto-secundario {
            font-size: 15px;
            font-weight: 500;
            opacity: 0.9;
            margin-top: 4px;
        }

        /* Notificação flutuante de confirmação */
        .toast-notificacao {
            position: fixed;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.96);
            color: #f8fafc;
            padding: 14px 26px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            display: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            white-space: nowrap;
            z-index: 100;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <span>CONTROLE DE PONTO</span>
        <div class="wifi-status">
            <div id="indicador-wifi" class="dot-status"></div>
            <span id="texto-wifi">Verificando rede...</span>
        </div>
    </div>

    <!-- Botão Verde: Entrada -->
    <button id="btn-entrada" class="card-btn" onclick="executarBatida('ENTRADA')">
        <div class="circulo-icone">☀️</div>
        <span class="texto-principal">Entrada</span>
        <span class="texto-secundario">Chegada ao trabalho</span>
    </button>

    <!-- Botão Vermelho: Saída -->
    <button id="btn-saida" class="card-btn" onclick="executarBatida('SAÍDA')">
        <div class="circulo-icone">🌙</div>
        <span class="texto-principal">Saída</span>
        <span class="texto-secundario">Fim do expediente</span>
    </button>

    <div id="toast" class="toast-notificacao">Processando...</div>

    <script>
        // ================= CONFIGURAÇÕES PRINCIPAIS =================
        // 1. Cole aqui a URL de publicação do seu Google Apps Script (terminada em /exec)
        //const URL_WEB_APP = "const URL_WEB_APP = https://script.google.com/macros/s/AKfycbzx1kOOKCWoaworM4n7BS7DQwUs-z9zr1ETJuHhdkjP9cVIJlmvAj6rkO2dVWpSX5Wp8w/exec";
        const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbwZz29NrMgb2YqVthF2osRcpmLCvMAWskUv20kQl_sm-IzjzinGih8XhjJhcWmz09Zasg/exec";

        // 2. Cole aqui o subdomínio completo que você criou no DuckDNS
        const DOMINIO_DUCKDNS = "halmos.duckdns.org";
        // ============================================================

        let redeValidada = false;
        let emProcessamento = false;

        // Função de voz em português
        function falar(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Para áudios anteriores se houver
                const voz = new SpeechSynthesisUtterance(texto);
                voz.lang = 'pt-BR';
                voz.rate = 0.92;
                window.speechSynthesis.speak(voz);
            }
        }

        function exibirToast(msg, tempo = 3500) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.style.display = "block";
            if (tempo > 0) {
                setTimeout(() => {
                    toast.style.display = "none";
                    emProcessamento = false;
                }, tempo);
            }
        }

        // Validação comparativa via Google DNS-over-HTTPS (DoH) e Ipify
        async function checarPresenca() {
            const dot = document.getElementById("indicador-wifi");
            const label = document.getElementById("texto-wifi");

            try {
                // 1. Consulta o IP público por onde o smartphone está navegando no momento
                const reqIp = fetch("https://api.ipify.org?format=json").then(r => r.json());

                // 2. Pergunta aos servidores DNS oficiais do Google qual é o IP atual do seu DuckDNS
                const reqDns = fetch(`https://dns.google/resolve?name=${DOMINIO_DUCKDNS}&type=A&t=${Date.now()}`).then(r => r.json());

                const [resIp, resDns] = await Promise.all([reqIp, reqDns]);

                const ipCelular = resIp && resIp.ip ? resIp.ip.trim() : "";
                let ipCasa = null;

                if (resDns && resDns.Answer && resDns.Answer.length > 0) {
                    ipCasa = resDns.Answer[0].data ? resDns.Answer[0].data.trim() : null;
                }

                // 3. Compara os IPs
                if (ipCelular && ipCasa && ipCelular === ipCasa) {
                    redeValidada = true;
                    dot.className = "dot-status conectado";
                    label.innerText = "Wi-Fi Residencial";
                    return true;
                } else {
                    redeValidada = false;
                    dot.className = "dot-status bloqueado";
                    label.innerText = "Fora do Wi-Fi";
                    return false;
                }
            } catch (e) {
                console.error("Erro na verificação de rede:", e);
                dot.className = "dot-status";
                label.innerText = "Verificando...";
                return false;
            }
        }

        // Executa a checagem ao abrir a página
        checarPresenca();

        // Reavalia a rede periodicamente a cada 20 segundos
        setInterval(checarPresenca, 20000);

        async function executarBatida(acao) {
            if (emProcessamento) return;
            emProcessamento = true;

            exibirToast("Verificando conexão...", 0);

            // Confirmação instantânea da rede no exato momento do clique
            const estaNoWifi = await checarPresenca();

            if (!estaNoWifi) {
                falar("Conecte-se à rede Wi-Fi do apartamento.");
                exibirToast("Conecte-se à rede Wi-Fi do apartamento", 4000);
                return;
            }

            // Horário da confirmação
            const agora = new Date();
            const h = agora.getHours();
            const m = ("0" + agora.getMinutes()).slice(-2);

            // Fala e exibe confirmação
            falar(`${acao === 'ENTRADA' ? 'Entrada' : 'Saída'} confirmada às ${h} horas e ${m} minutos.`);
            exibirToast(`Registrado: ${acao} às ${h}:${m}`, 4000);

            // Envia para o Google Sheets em segundo plano
            const urlFinal = `${URL_WEB_APP}?acao=${encodeURIComponent(acao)}&t=${Date.now()}`;
            fetch(urlFinal, { method: 'GET', mode: 'no-cors' }).catch(() => {
                const img = new Image();
                img.src = urlFinal;
            });
        }
    </script>
</body>
</html>
